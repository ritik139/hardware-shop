<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Korraz Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-seal">K</div>
        <div class="brand-word">KORRAZ<span>Admin Console</span></div>
      </div>
      <nav>
        <a href="dashboard.html" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          Dashboard
        </a>
        <a href="products.html" data-page="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.7 7.4 12 12l8.3-4.6M12 12v9"/></svg>
          Products
        </a>
        <a href="enquiries.html" data-page="enquiries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
          Enquiries
        </a>
      </nav>
      <div class="logout">
        <button id="logoutBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="main">
      <p class="eyebrow">Overview</p>
      <h1>Dashboard</h1>
      <p class="subtitle">A quick look at how the store is running today.</p>

      <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="num">—</div><div class="label">Total Products</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">Total Enquiries</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">New (Unread)</div></div>
      </div>

      <div class="toolbar">
        <h2 style="font-size:1.15rem; margin:0;">Recent Enquiries</h2>
        <a href="enquiries.html" class="btn btn-outline">View all</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Interest</th><th>Status</th><th>Received</th></tr></thead>
          <tbody id="recentEnquiriesBody">
            <tr><td colspan="5" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
  <script>
    (async function () {
      await requireAdminAuth();
      initSidebar('dashboard');

      try {
        const [productsRes, enquiriesRes] = await Promise.all([
          adminFetch('/api/products/admin/all'),
          adminFetch('/api/enquiries/admin/all'),
        ]);
        const products = await productsRes.json();
        const enquiries = await enquiriesRes.json();
        const newCount = enquiries.filter((e) => e.status === 'new').length;

        const cards = document.querySelectorAll('#statGrid .stat-card .num');
        cards[0].textContent = products.length;
        cards[1].textContent = enquiries.length;
        cards[2].textContent = newCount;

        const tbody = document.getElementById('recentEnquiriesBody');
        const recent = enquiries.slice(0, 6);
        if (recent.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No enquiries yet.</td></tr>';
        } else {
          tbody.innerHTML = recent
            .map(
              (e) => `
            <tr>
              <td>${escapeHtml(e.name)}</td>
              <td>${escapeHtml(e.phone)}</td>
              <td>${escapeHtml(e.interest)}</td>
              <td><span class="badge badge-${e.status}">${e.status}</span></td>
              <td>${formatDate(e.createdAt)}</td>
            </tr>`
            )
            .join('');
        }
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
